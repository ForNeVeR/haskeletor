[versions]
intellij-gradle = "2.16.0"
intellij-platform = "2026.1"
junit = "6.1.0"
kotlin = "2.3.21"
scala = "3.9.0"

[libraries]
commons-text = { module = "org.apache.commons:commons-text", version = "1.15.0" }
directories = { module = "io.github.soc:directories", version = "12" }
fastparse = { module = "com.lihaoyi:fastparse_3", version = "3.1.1" }
junit-jupiter-api = { module = "org.junit.jupiter:junit-jupiter-api", version.ref = "junit" }
junit-jupiter-engine = { module = "org.junit.jupiter:junit-jupiter-engine", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit" }
junit4 = "junit:junit:4.13.2"
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
scaffeine = { module = "com.github.blemale:scaffeine_3", version = "5.3.0" }
scala-library = { module = "org.scala-lang:scala-library", version.ref = "scala" }
scala3-library = { module = "org.scala-lang:scala3-library_3", version.ref = "scala" }
scalatest = { module = "org.scalatest:scalatest_3", version = "3.3.0-SNAP4" }
scalatestplus-junit = { module = "org.scalatestplus:junit-4-13_3", version = "3.2.20.0" }
snakeyaml = { module = "org.yaml:snakeyaml", version = "2.6" }
spray-json = { module = "io.spray:spray-json_3", version = "1.3.6" }

[plugins]
changelog = "org.jetbrains.changelog:2.5.0"
gradle-jvm-wrapper = "me.filippov.gradle.jvm.wrapper:0.16.0"
intellij-grammar-kit = { id = "org.jetbrains.intellij.platform.grammarkit", version.ref = "intellij-gradle" }
intellij-platform = { id = "org.jetbrains.intellij.platform", version.ref = "intellij-gradle" }
